<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ausbilder-Check-in</title>
  <style>
    :root {
      --bg:#000; --text:#fff; --card:#111; --border:#333; --muted:#bbb;
      --ok:#4ade80; --warn:#facc15; --err:#f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap {
      max-width:800px; margin:0 auto; padding:16px;
    }
    h1 { margin:8px 0 16px; }
    .card {
      background:var(--card); border:1px solid var(--border);
      border-radius:12px; padding:16px; margin-bottom:16px;
    }
    video {
      width:100%; max-height:480px; background:#000;
      border-radius:12px; border:1px solid #222;
    }
    button {
      background:#fff; color:#000; border:none; border-radius:10px;
      padding:10px 14px; font-weight:bold; cursor:pointer;
    }
    button[disabled] { opacity:0.6; cursor:not-allowed; }
    .muted { color:var(--muted); }
    .ok { color:var(--ok); }
    .warn { color:var(--warn); }
    .err { color:var(--err); }
    select {
      background:#000; color:#fff; border:1px solid var(--border);
      border-radius:10px; padding:8px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Ausbilder-Check-in</h1>

  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button id="startBtn">Scan starten</button>
      <button id="stopBtn" disabled>Stopp</button>
      <select id="cameraSelect"></select>
      <span id="msg" class="muted" style="margin-left:auto">Bereit</span>
    </div>
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div class="card">
    <button onclick="location.href='index.html'">Zurück</button>
    <p class="muted" style="margin-top:8px;font-size:14px">
      Die Kamera funktioniert nur über HTTPS oder localhost.<br>
      Falls sie nicht startet: Kamera in den Website-Einstellungen erlauben.
    </p>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="attendance-shared.js"></script>

<!-- ZXing Browser (Scanner) -->
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

<script>
(async () => {
  const { auth, db, parseQrPayload } = window._att || {};
  if (!auth || !db) {
    alert("Firebase nicht initialisiert."); location.href="index.html"; return;
  }

  // Auth prüfen
  await new Promise(res => auth.onAuthStateChanged(u => {
    if (!u) { location.href = "index.html"; } else res();
  }));

  const video = document.getElementById("video");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const cameraSelect = document.getElementById("cameraSelect");
  const msg = document.getElementById("msg");

  let codeReader = new ZXingBrowser.BrowserMultiFormatReader();
  let running = false;

  function setMsg(t, cls="muted") {
    msg.className = cls; msg.textContent = t;
  }

  async function listCameras() {
    try {
      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      cameraSelect.innerHTML = "";
      devices.forEach((d,i)=>{
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = d.label || `Kamera ${i+1}`;
        cameraSelect.appendChild(opt);
      });
      if (!devices.length) {
        cameraSelect.innerHTML = '<option>Keine Kamera gefunden</option>';
      }
    } catch (e) {
      console.warn("Kameras konnten nicht gelistet werden:", e);
      setMsg("Kameras nicht verfügbar", "err");
    }
  }

  async function startScan() {
    if (location.protocol !== "https:" && location.hostname !== "localhost") {
      alert("Kamera benötigt HTTPS oder localhost!");
      return;
    }
    await stopScan();
    running = true;
    setMsg("Scanner aktiv…", "warn");
    startBtn.disabled = true;
    stopBtn.disabled = false;
    const deviceId = cameraSelect.value || undefined;
    try {
      await codeReader.decodeFromVideoDevice(deviceId, video, async (result, err) => {
        if (result && running) {
          const txt = result.getText();
          console.log("QR erkannt:", txt);
          await onQrScanned(txt);
          setMsg("QR erkannt! 🎉", "ok");
          await stopScan();
        }
        if (err && !(err instanceof ZXingBrowser.NotFoundException)) {
          console.warn("Scanner Fehler:", err);
        }
      });
    } catch (e) {
      console.error(e);
      setMsg("Kamera konnte nicht gestartet werden.", "err");
    }
  }

  async function stopScan() {
    running = false;
    try { await codeReader.reset(); } catch(e){}
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setMsg("Bereit", "muted");
  }

  async function onQrScanned(text) {
    try {
      const payload = parseQrPayload(text);
      if (!payload) { setMsg("Ungültiger QR-Code", "err"); return; }

      const { s: sessionId, n: nonce } = payload;
      const sref = db.collection("sessions").doc(sessionId);
      const snap = await sref.get();
      if (!snap.exists) { setMsg("Termin nicht gefunden", "err"); return; }
      const s = snap.data();
      if (!s.open) { setMsg("Check-in ist geschlossen", "err"); return; }
      if (s.qrNonce !== nonce) { setMsg("QR ist veraltet", "err"); return; }

      const u = auth.currentUser;
      await sref.collection("checkins").doc(u.uid).set({
        uid: u.uid,
        email: u.email || "",
        displayName: u.displayName || "",
        checkedAt: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent: navigator.userAgent,
        nonce
      });

      setMsg("Erfolgreich eingecheckt 🎉", "ok");
    } catch(e) {
      console.error(e);
      setMsg("Check-in fehlgeschlagen: " + e.message, "err");
    }
  }

  startBtn.onclick = startScan;
  stopBtn.onclick = stopScan;
  await listCameras();
})();
</script>
</body>
</html>
