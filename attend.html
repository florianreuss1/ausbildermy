<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ausbilder-Check-in</title>
  <style>
    :root { --bg:#000; --text:#fff; --card:#111; --border:#333; --muted:#bbb; --ok:#4ade80; --warn:#facc15; --err:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: Arial, Helvetica, sans-serif; }
    .wrap { max-width:820px; margin:0 auto; padding:16px; }
    h1 { margin:8px 0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
    video { width:100%; max-height:520px; background:#000; border-radius:12px; border:1px solid #222; }
    button { background:#fff; color:#000; border:none; border-radius:10px; padding:10px 14px; font-weight:bold; cursor:pointer; }
    button[disabled]{ opacity:.6; cursor:not-allowed; }
    select { background:#000; color:#fff; border:1px solid var(--border); border-radius:10px; padding:8px; }
    .muted { color:var(--muted); } .ok{ color:var(--ok);} .warn{ color:var(--warn);} .err{ color:var(--err);}
    pre { white-space:pre-wrap; font-size:12px; color:#ccc; background:#0c0c0c; padding:8px; border-radius:8px; border:1px solid #222; max-height:220px; overflow:auto; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Ausbilder-Check-in</h1>

  <div class="card">
    <div class="row">
      <button id="startBtn">Scan starten</button>
      <button id="stopBtn" disabled>Stopp</button>
      <select id="cameraSelect" title="Kamera auswählen"></select>
      <span id="msg" class="muted" style="margin-left:auto">Bereit</span>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <div id="hint" class="muted" style="margin-top:8px;font-size:14px">
      Erfordert <strong>HTTPS</strong> (oder <code>localhost</code>). Bei iOS erst nach Button-Klick möglich.
    </div>
    <details class="card" style="margin-top:12px;">
      <summary>Diagnose</summary>
      <div id="diag"></div>
      <pre id="log"></pre>
    </details>
  </div>

  <div class="card">
    <button onclick="location.href='index.html'">Zurück</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script src="attendance-shared.js"></script>

<!-- ZXing UMD (liefert window.ZXingBrowser) -->
<script id="zxing-script" src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

<script>
(async () => {
  // ---------- Logging & Helpers ----------
  const logEl = document.getElementById('log');
  const diag  = document.getElementById('diag');
  const msgEl = document.getElementById('msg');
  const log = (...a)=>{
    const line = a.map(x=>{
      if (x instanceof Error) return `${x.name}: ${x.message}\n${x.stack||''}`;
      if (typeof x==='object') { try { return JSON.stringify(x); } catch(_) { return String(x); } }
      return String(x);
    }).join(' ');
    console.log(...a);
    logEl.textContent += line + "\n";
  };
  const setMsg = (t, cls='muted') => { msgEl.className=cls; msgEl.textContent=t; };
  const showDiag = (html) => { diag.innerHTML = html; };

  // ---------- Firebase ----------
  const { auth, db, parseQrPayload } = window._att || {};
  if (!auth || !db) { alert("Firebase nicht initialisiert."); location.href="index.html"; return; }
  await new Promise(res => auth.onAuthStateChanged(u => { if (!u) location.href='index.html'; else res(); }));

  // ---------- DOM ----------
  const video = document.getElementById("video");
  const startBtn = document.getElementById("startBtn");
  const stopBtn  = document.getElementById("stopBtn");
  const cameraSelect = document.getElementById("cameraSelect");

  // ---------- State ----------
  let running = false;
  let reader  = null;
  let previewStream = null;

  // ---------- Sicherheits-/Einbettungs-Checks ----------
  if (location.protocol !== "https:" && location.hostname !== "localhost"){
    setMsg("Kamera benötigt HTTPS oder localhost", "err");
    log("Nicht sicherer Kontext:", location.href);
  }
  if (window !== window.top) {
    log("In iframe ausgeführt – iframe braucht allow=\"camera\"");
  }

  // ---------- Warte sicher, bis ZXing geladen ist ----------
  await new Promise((resolve)=>{
    if (typeof ZXingBrowser === 'object') return resolve();
    const s = document.getElementById('zxing-script');
    s.addEventListener('load', ()=> resolve());
    s.addEventListener('error', ()=> { log('ZXing Script konnte nicht geladen werden'); resolve(); });
  });
  log("ZXingBrowser Typ:", typeof ZXingBrowser);

  // ---------- Kameraliste ----------
  async function listCameras(){
    try{
      if (typeof ZXingBrowser !== 'object') throw new Error('ZXingBrowser fehlt');
      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      cameraSelect.innerHTML='';
      if (!devices.length){ cameraSelect.innerHTML='<option value="">Keine Kamera gefunden</option>'; return; }
      devices.forEach((d,i)=>{
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Kamera ${i+1}`;
        cameraSelect.appendChild(opt);
      });
      const back = [...devices].find(d => /back|rear|umwelt|rück/i.test(d.label));
      if (back) cameraSelect.value = back.deviceId;
      log("Gefundene Kameras:", devices.map(d=>({id:d.deviceId,label:d.label})));
    }catch(e){
      log("Kameraliste Fehler:", e);
      setMsg("Kameras nicht verfügbar", "err");
    }
  }

  // ---------- ZXing direkt die Kamera öffnen lassen (PRIO 1) ----------
  async function startZXingDirect(){
    try{
      running = false;
      try{ if (reader) await reader.reset(); }catch(_){}
      if (previewStream){ previewStream.getTracks().forEach(t=>t.stop()); previewStream=null; }
      video.srcObject = null;

      if (typeof ZXingBrowser !== 'object') throw new Error('ZXingBrowser nicht geladen');

      reader = new ZXingBrowser.BrowserMultiFormatReader();
      const deviceId = cameraSelect.value || undefined;
      running = true;
      setMsg("Scanner aktiv – halte den QR ins Bild", "warn");

      await reader.decodeFromVideoDevice(deviceId, video, async (result, err) => {
        if (result && running) {
          const txt = result.getText();
          log("QR erkannt:", txt);
          await onQrScanned(txt);
          setMsg("QR erkannt! 🎉", "ok");
          // running = false; await reader.reset(); // falls nach Treffer stoppen
        }
        if (err && !(err instanceof ZXingBrowser.NotFoundException)) {
          log("ZXing Fehler:", (err && (err.name||err.message)) || err);
        }
      });

      log("ZXing gestartet (decodeFromVideoDevice).");
      return true;
    }catch(e){
      log("ZXing Startfehler (direct):", e);
      setMsg("Scanner konnte nicht gestartet werden (direct)", "err");
      return false;
    }
  }

  // ---------- Fallback: Kamera selbst öffnen + decodeFromVideoElement (PRIO 2) ----------
  async function startWithPreviewFallback(){
    try{
      running = false;
      try{ if (reader) await reader.reset(); }catch(_){}
      if (previewStream){ previewStream.getTracks().forEach(t=>t.stop()); previewStream=null; }
      video.srcObject = null;

      const deviceId = cameraSelect.value || undefined;
      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: 'environment' } },
        audio: false
      };
      log("getUserMedia constraints:", constraints);
      previewStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = previewStream;
      setMsg("Kamera läuft (Vorschau)", "ok");

      if (typeof ZXingBrowser !== 'object') throw new Error('ZXingBrowser nicht geladen');
      reader = new ZXingBrowser.BrowserMultiFormatReader();
      running = true;
      setMsg("Scanner aktiv (Fallback) – halte den QR ins Bild", "warn");

      await reader.decodeFromVideoElement(video, async (result, err) => {
        if (result && running){
          const txt = result.getText();
          log("QR erkannt (fallback):", txt);
          await onQrScanned(txt);
          setMsg("QR erkannt! 🎉", "ok");
          // running = false; await reader.reset();
        }
        if (err && !(err instanceof ZXingBrowser.NotFoundException)) {
          log("ZXing Fehler (fallback):", (err && (err.name||err.message)) || err);
        }
      });

      log("ZXing gestartet (decodeFromVideoElement fallback).");
      return true;
    }catch(e){
      log("Fallback Startfehler:", e);
      setMsg("Scanner konnte nicht gestartet werden (fallback)", "err");
      return false;
    }
  }

  async function stopAll(){
    running = false;
    try{ if (reader) { await reader.reset(); reader=null; } }catch(_){}
    try{ if (previewStream){ previewStream.getTracks().forEach(t=>t.stop()); previewStream=null; } }catch(_){}
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled  = true;
    setMsg("Bereit","muted");
  }

  // ---------- Firestore-Check-in ----------
  async function onQrScanned(text){
    try{
      const payload = parseQrPayload(text);
      if (!payload) { setMsg("Ungültiger QR-Code", "err"); return; }
      const { s: sessionId, n: nonce } = payload;

      const sref = db.collection("sessions").doc(sessionId);
      const snap = await sref.get();
      if (!snap.exists) { setMsg("Termin nicht gefunden", "err"); return; }
      const s = snap.data();
      if (!s.open) { setMsg("Check-in ist geschlossen", "err"); return; }
      if (s.qrNonce !== nonce) { setMsg("QR ist veraltet", "err"); return; }

      const u = auth.currentUser;
      await sref.collection("checkins").doc(u.uid).set({
        uid: u.uid,
        email: u.email || "",
        displayName: u.displayName || "",
        checkedAt: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent: navigator.userAgent,
        nonce
      });
      setMsg("Erfolgreich eingecheckt 🎉","ok");
    }catch(e){
      log("Check-in Fehler:", e);
      setMsg("Check-in fehlgeschlagen: " + (e.message||e), "err");
    }
  }

  // ---------- Events ----------
  startBtn.onclick = async () => {
    try{
      startBtn.disabled = true;
      stopBtn.disabled  = false;

      // 1) Primärweg: ZXing öffnet selbst
      const ok1 = await startZXingDirect();
      if (ok1) return;

      // 2) Fallback: Vorschau + decodeFromVideoElement
      const ok2 = await startWithPreviewFallback();
      if (ok2) return;

      // 3) Beide gescheitert
      startBtn.disabled = false;
      stopBtn.disabled  = true;
    }catch(e){
      log("startBtn Fehler:", e);
      setMsg("Start fehlgeschlagen.", "err");
      startBtn.disabled = false;
      stopBtn.disabled  = true;
    }
  };

  stopBtn.onclick = stopAll;
  cameraSelect.onchange = async () => {
    if (running) { await stopAll(); await startZXingDirect(); }
  };

  // ---------- Init ----------
  await (async ()=>{
    if (location.protocol !== "https:" && location.hostname !== "localhost"){
      showDiag('<div class="err">Nicht sicherer Kontext (HTTPS/localhost nötig)</div>');
    }
    // Kameras einmal listen
    await listCameras();
  })();
})();
</script>
</body>
</html>
